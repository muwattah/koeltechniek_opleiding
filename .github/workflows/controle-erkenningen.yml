name: Erkende koeltechnici - actualiseer lijst

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */3 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/controle-erkenningen.yml"
      - "erkende-koeltechnici/index.html"
      - "erkende-koeltechnici/scripts/update_data.py"

permissions:
  contents: write

concurrency:
  group: erkenningen-checker
  cancel-in-progress: false

jobs:
  update-list:
    runs-on: ubuntu-latest
    steps:
      - name: Haal repository op
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installeer PDF-ondersteuning
        run: python -m pip install "PyMuPDF==1.26.7"
      - name: Download de officiële Vlaamse lijst
        run: python erkende-koeltechnici/scripts/update_data.py
      - name: Publiceer bijgewerkte zoekgegevens zonder bestaande bestanden te wijzigen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add erkende-koeltechnici/data.js
          if git diff --cached --quiet; then
            echo "Geen wijzigingen"
          else
            git commit -m "Actualiseer erkende koeltechnici"
            git push origin HEAD:main
          fi
